version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: zerotouch-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (디바이스용 TCP)
      - "9001:9001"   # MQTT over WebSocket (웹 브라우저용)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - zerotouch-net

  web:
    image: node:20-alpine
    container_name: zerotouch-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000" # React 기본 개발 서버 포트로 변경
    environment:
      - REACT_APP_MQTT_BROKER_URL=ws://localhost:9001
      - REACT_APP_MQTT_TOPIC=zerotouch/cam01/face
      - CHOKIDAR_USEPOLLING=true # 윈도우 환경 실시간 감지 필수 옵션
    command: sh -c "npm install && npm start"
    depends_on:
      - mosquitto
    networks:
      - zerotouch-net

networks:
  zerotouch-net:
    driver: bridge
