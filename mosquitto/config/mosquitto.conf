# 기본 리스너 (MQTT, 디바이스용)
listener 1883
protocol mqtt

# WebSocket 리스너 (브라우저 클라이언트용)
listener 9001
protocol websockets

# 익명 접속 허용 여부
# 운영 환경에서는 false로 설정하고 password_file 사용 권장
allow_anonymous true

# 로그 및 영속성 설정
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
